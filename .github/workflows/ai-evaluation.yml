name: AI QE Evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "data/**"
      - "datasets/**"
      - "policies/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/ai-evaluation.yml"
      - "requirements.txt"

  workflow_dispatch:
    inputs:
      show_cost_usd:
        description: "Show estimated USD cost in console output"
        required: false
        type: boolean
        default: false

jobs:
  ai-evaluation:
    runs-on: ubuntu-latest
    env:
      SHOW_COST_USD: ${{ inputs.show_cost_usd }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SUT_MODEL: ${{ vars.SUT_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Nightly Dataset
        run: |
          python src/dataset_validator.py datasets/evaluation_dataset.json

      - name: Run Nightly Evaluation — 80 cases
        run: |
          python src/evaluation_runner.py --dataset datasets/evaluation_dataset.json --output reports/evaluation_results.json

      - name: Evaluate Nightly Dataset
        run: |
          python src/evaluator.py --input reports/evaluation_results.json --output reports/evaluation_evaluated.json

      - name: Nightly Quality Gate
        run: |
          python src/quality_gate.py --report reports/evaluation_evaluated.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-nightly-oracle-verification
          path: reports/
