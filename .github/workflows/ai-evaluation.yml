name: AI QE Evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "data/**"
      - "datasets/**"
      - "tests/**"
      - ".github/workflows/ai-evaluation.yml"
      - "requirements.txt"

  workflow_dispatch:
    inputs:
      show_cost_usd:
        description: "Show estimated USD cost in console output"
        required: false
        type: boolean
        default: false

jobs:
  ai-evaluation:
    runs-on: ubuntu-latest
    env:
      SHOW_COST_USD: ${{ inputs.show_cost_usd }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build AI Risk Coverage Matrix
        run: |
          python src/risk_coverage.py --output reports/risk_coverage.json

      - name: Run PR Critical Dataset
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUT_MODEL: ${{ vars.SUT_MODEL }}
        run: |
          python src/pr_evaluation_runner.py

      - name: Evaluate PR Critical Dataset
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: |
          python src/pr_evaluator.py

      - name: Hallucination Retry Policy
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUT_MODEL: ${{ vars.SUT_MODEL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: |
          python src/hallucination_retry.py

      - name: Quality Gate
        run: |
          python src/quality_gate.py --report reports/pr_evaluated.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-evaluation-reports
          path: reports/
