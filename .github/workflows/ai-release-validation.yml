name: AI Release Validation

on:
  workflow_dispatch:

jobs:
  golden-validation:
    name: Golden Release Validation
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SUT_MODEL: ${{ vars.SUT_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Golden Dataset
        run: >
          python src/dataset_validator.py
          datasets/golden_dataset.json

      - name: Run Golden Evaluation
        run: >
          python src/evaluation_runner.py
          --dataset datasets/golden_dataset.json
          --output reports/golden_release_results.json

      - name: Evaluate Golden Results
        run: >
          python src/evaluator.py
          --input reports/golden_release_results.json
          --output reports/golden_release_evaluated.json

      - name: Run Golden Quality Gate
        run: >
          python src/quality_gate.py
          --report reports/golden_release_evaluated.json

      - name: Upload Golden Release Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-release-validation-reports
          path: |
            reports/golden_release_results.json
            reports/golden_release_evaluated.json

  nightly-validation:
    name: Nightly Broad-Risk Validation
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SUT_MODEL: ${{ vars.SUT_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Nightly Dataset
        run: >
          python src/dataset_validator.py
          datasets/evaluation_dataset.json

      - name: Run Nightly Evaluation
        run: >
          python src/evaluation_runner.py
          --dataset datasets/evaluation_dataset.json
          --output reports/nightly_release_results.json

      - name: Evaluate Nightly Results
        run: >
          python src/evaluator.py
          --input reports/nightly_release_results.json
          --output reports/nightly_release_evaluated.json

      - name: Run Nightly Quality Gate
        run: >
          python src/quality_gate.py
          --report reports/nightly_release_evaluated.json

      - name: Upload Nightly Release Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-validation-reports
          path: |
            reports/nightly_release_results.json
            reports/nightly_release_evaluated.json

  release-quality:
    name: Release Quality Gate
    needs:
      - golden-validation
      - nightly-validation
    runs-on: ubuntu-latest

    steps:
      - name: Confirm release validation gates
        run: |
          echo "Golden and Nightly release validation gates passed."
          echo "RC/tag/Jira/Confluence scope integration will be added when release governance is connected."