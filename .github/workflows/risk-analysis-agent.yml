name: Risk Analysis Agent Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - config/risk_analysis_prompt.txt
      - src/risk_analysis_agent.py
      - src/run_risk_analysis.py
      - src/evaluate_risk_analysis_agent.py
      - datasets/risk_analysis_evaluation_dataset.json
      - tests/test_risk_analysis_agent.py
      - tests/test_risk_analysis_execution.py
      - .github/workflows/risk-analysis-agent.yml

jobs:
  evaluate-risk-agent:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      RISK_ANALYSIS_MODEL: ${{ vars.RISK_ANALYSIS_MODEL || vars.REQUIREMENTS_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_risk_analysis_agent.py tests/test_risk_analysis_execution.py
      - name: Controlled Risk Agent evaluation
        run: python src/evaluate_risk_analysis_agent.py
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-analysis-agent-evaluation-${{ github.run_id }}
          path: reports/risk_analysis_agent_evaluation.json
