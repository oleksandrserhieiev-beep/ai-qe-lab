name: Test Analysis & Design Agent

on:
  workflow_dispatch:
    inputs:
      issue_keys:
        description: "Jira issue keys (one or many; comma, space, or semicolon separated)"
        required: true
        type: string
      force_analysis:
        description: "Ignore unchanged-content cache when semantic execution is enabled"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - config/test_analysis_design_prompt.txt
      - src/agent_content_cache.py
      - src/test_analysis_design.py
      - src/test_analysis_design_cache.py
      - tests/test_test_analysis_design.py
      - docs/test_analysis_design_agent.md
      - .github/workflows/test-analysis-design-agent.yml

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate Test Analysis & Design contracts
        run: python -m pytest -q tests/test_test_analysis_design.py
      - name: Skeleton boundary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Test Analysis & Design semantic execution is intentionally not enabled in this skeleton."
          echo "Input Jira IDs: ${{ inputs.issue_keys }}"
          echo "Next implementation phase: eligibility -> dataset health -> coverage/similarity -> cached proposal -> human decision -> validated JSON promotion."
