name: Requirements Review Agent

on:
  workflow_dispatch:
    inputs:
      issue_keys:
        description: "Jira issue keys (comma, space, or semicolon separated)"
        required: true
        type: string

jobs:
  requirements-review:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      REQUIREMENTS_REVIEW_MODEL: ${{ vars.REQUIREMENTS_REVIEW_MODEL }}
      JIRA_ALLOWED_STATUSES: ${{ vars.JIRA_ALLOWED_STATUSES || 'In Progress' }}
      JIRA_REQUIRE_DESCRIPTION: ${{ vars.JIRA_REQUIRE_DESCRIPTION || 'true' }}
      JIRA_REQUIRE_ACCEPTANCE_CRITERIA: ${{ vars.JIRA_REQUIRE_ACCEPTANCE_CRITERIA || 'true' }}
      JIRA_ACCEPTANCE_CRITERIA_FIELD: ${{ vars.JIRA_ACCEPTANCE_CRITERIA_FIELD }}
      ISSUE_KEYS: ${{ inputs.issue_keys }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate batch input
        run: |
          if [ -z "$ISSUE_KEYS" ]; then
            echo "issue_keys is required"
            exit 1
          fi
          echo "Requirements Review Agent manual batch: $ISSUE_KEYS"

      - name: Run Requirements Review batch
        run: |
          python src/run_requirements_review_batch.py "$ISSUE_KEYS"

      - name: Upload requirements review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-review-batch-${{ github.run_id }}
          path: reports/
