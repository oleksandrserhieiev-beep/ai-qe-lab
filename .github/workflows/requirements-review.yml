name: Requirements Review Agent

on:
  workflow_dispatch:
    inputs:
      issue_keys:
        description: "Jira issue keys (comma, space, or semicolon separated)"
        required: true
        type: string
      force_review:
        description: "Ignore unchanged-content cache and run the LLM again"
        required: false
        default: false
        type: boolean

concurrency:
  group: requirements-review-cache
  cancel-in-progress: false

jobs:
  requirements-review:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      REQUIREMENTS_REVIEW_MODEL: ${{ vars.REQUIREMENTS_REVIEW_MODEL }}
      JIRA_ALLOWED_STATUSES: ${{ vars.JIRA_ALLOWED_STATUSES || 'In Progress' }}
      JIRA_REQUIRE_DESCRIPTION: ${{ vars.JIRA_REQUIRE_DESCRIPTION || 'true' }}
      JIRA_REQUIRE_ACCEPTANCE_CRITERIA: ${{ vars.JIRA_REQUIRE_ACCEPTANCE_CRITERIA || 'true' }}
      JIRA_ACCEPTANCE_CRITERIA_FIELD: ${{ vars.JIRA_ACCEPTANCE_CRITERIA_FIELD }}
      REQUIREMENTS_REVIEW_CACHE_PATH: .cache/requirements-review/cache.json
      REQUIREMENTS_REVIEW_FORCE: ${{ inputs.force_review }}
      ISSUE_KEYS: ${{ inputs.issue_keys }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore requirements review content cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/requirements-review
          key: requirements-review-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            requirements-review-cache-

      - name: Validate batch input
        run: |
          if [ -z "$ISSUE_KEYS" ]; then
            echo "issue_keys is required"
            exit 1
          fi
          echo "Requirements Review Agent manual batch: $ISSUE_KEYS"

      - name: Run Requirements Review batch
        run: |
          python src/run_requirements_review_batch.py "$ISSUE_KEYS"

      - name: Build Risk Analysis handoff artifacts
        if: always()
        run: |
          python src/requirements_review_handoff.py --reports-dir reports --output-dir reports/handoffs

      - name: Save requirements review content cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/requirements-review
          key: requirements-review-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload requirements review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-review-batch-${{ github.run_id }}
          path: reports/
