name: Requirements Review Agent

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Jira issue key"
        required: true
        type: string
  repository_dispatch:
    types:
      - jira-requirements-review

jobs:
  requirements-review:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      REQUIREMENTS_REVIEW_MODEL: ${{ vars.REQUIREMENTS_REVIEW_MODEL }}
      ISSUE_KEY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.issue_key || inputs.issue_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate issue key
        run: |
          if [ -z "$ISSUE_KEY" ]; then
            echo "issue_key is required"
            exit 1
          fi
          echo "Requirements Review Agent will review: $ISSUE_KEY"

      - name: Run Requirements Review Agent
        run: |
          python src/run_requirements_review.py "$ISSUE_KEY"

      - name: Publish AI telemetry summary
        if: success()
        run: |
          python src/write_requirements_review_summary.py

      - name: Upload requirements review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-review-${{ env.ISSUE_KEY }}
          path: reports/
