name: AI Nightly Evaluation

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

jobs:
  nightly-evaluation:
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SUT_MODEL: ${{ vars.SUT_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Full Evaluation Dataset
        run: >
          python src/evaluation_runner.py
          --dataset datasets/evaluation_dataset.json
          --output reports/evaluation_results.json

      - name: Evaluate Nightly Results
        run: >
          python src/evaluator.py
          --input reports/evaluation_results.json
          --output reports/evaluation_evaluated.json

      - name: Run Quality Gate
        run: >
          python src/quality_gate.py
          --report reports/evaluation_evaluated.json

      - name: Upload Nightly Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evaluation-reports
          path: |
            reports/evaluation_results.json
            reports/evaluation_evaluated.json