name: Back-to-Back Model Comparison

on:
  workflow_dispatch:
    inputs:
      model_a:
        description: Model A
        required: true
        type: choice
        default: claude-sonnet-5
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
      model_b:
        description: Model B
        required: true
        type: choice
        default: gpt-5.6-sol
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna

jobs:
  compare-models:
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate PR Critical Dataset
        run: |
          python src/dataset_validator.py datasets/pr_critical_dataset.json

      - name: Run Back-to-Back SUT Evaluation
        run: |
          python src/back_to_back_runner.py \
            --model-a "${{ inputs.model_a }}" \
            --model-b "${{ inputs.model_b }}" \
            --output-dir reports/back_to_back

      - name: Evaluate Model A
        run: |
          python src/evaluator.py \
            --input reports/back_to_back/model_a_raw.json \
            --output reports/back_to_back/model_a_evaluated.json

      - name: Evaluate Model B
        run: |
          python src/evaluator.py \
            --input reports/back_to_back/model_b_raw.json \
            --output reports/back_to_back/model_b_evaluated.json

      - name: Compare Model A vs Model B
        run: |
          python src/back_to_back_compare.py \
            --model-a-report reports/back_to_back/model_a_evaluated.json \
            --model-b-report reports/back_to_back/model_b_evaluated.json \
            --output reports/back_to_back/comparison_report.json

      - name: Publish comparison summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/back_to_back/comparison_report.json")
          if not path.exists():
              raise SystemExit(0)

          report = json.loads(path.read_text(encoding="utf-8"))
          q = report.get("quality_comparison", {})
          o = report.get("operational_comparison", {})
          c = report.get("case_outcomes", {})
          d = report.get("decision_signals", {})

          lines = [
              "## Back-to-Back Model Comparison",
              "",
              "| Metric | Model A | Model B | Delta B-A |",
              "|---|---:|---:|---:|",
          ]
          for metric in [
              "overall_pass_rate",
              "correctness_rate",
              "groundedness_rate",
              "retrieval_hit_rate",
              "constraint_adherence_rate",
              "hallucination_rate",
          ]:
              value = q.get(metric, {})
              lines.append(f"| {metric} | {value.get('model_a')} | {value.get('model_b')} | {value.get('delta_b_minus_a')} |")

          lines.extend([
              "",
              "### Operational metrics",
              "",
              "| Metric | Model A | Model B | Delta B-A |",
              "|---|---:|---:|---:|",
          ])
          for metric in [
              "avg_latency_ms",
              "p95_latency_ms",
              "total_input_tokens",
              "total_output_tokens",
              "total_tokens",
              "avg_tokens_per_case",
          ]:
              value = o.get(metric, {})
              lines.append(f"| {metric} | {value.get('model_a')} | {value.get('model_b')} | {value.get('delta_b_minus_a')} |")

          lines.extend([
              "",
              f"Improved cases: {c.get('improved', 0)}",
              f"Regressed cases: {c.get('regressed', 0)}",
              f"Unchanged cases: {c.get('unchanged', 0)}",
              f"Critical regressions: {d.get('critical_regressions', [])}",
          ])

          with open(Path.cwd() / Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload Back-to-Back reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: back-to-back-${{ inputs.model_a }}-vs-${{ inputs.model_b }}
          path: reports/back_to_back/
          if-no-files-found: warn
