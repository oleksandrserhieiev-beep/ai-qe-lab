name: Back-to-Back Model Comparison

on:
  workflow_dispatch:
    inputs:
      model_a:
        description: Baseline model
        required: true
        type: choice
        default: claude-sonnet-5
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
      model_b:
        description: Candidate model
        required: true
        type: choice
        default: gpt-5.6-sol
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna

jobs:
  compare-models:
    name: ${{ inputs.model_a }} vs ${{ inputs.model_b }}
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate PR Critical Dataset
        run: |
          python src/dataset_validator.py datasets/pr_critical_dataset.json

      - name: Run ${{ inputs.model_a }} vs ${{ inputs.model_b }}
        run: |
          python src/back_to_back_runner.py \
            --model-a "${{ inputs.model_a }}" \
            --model-b "${{ inputs.model_b }}" \
            --output-dir reports/back_to_back

      - name: Evaluate ${{ inputs.model_a }}
        run: |
          python src/evaluator.py \
            --input reports/back_to_back/model_a_raw.json \
            --output reports/back_to_back/model_a_evaluated.json

      - name: Evaluate ${{ inputs.model_b }}
        run: |
          python src/evaluator.py \
            --input reports/back_to_back/model_b_raw.json \
            --output reports/back_to_back/model_b_evaluated.json

      - name: Compare ${{ inputs.model_a }} vs ${{ inputs.model_b }}
        run: |
          python src/back_to_back_compare.py \
            --model-a-report reports/back_to_back/model_a_evaluated.json \
            --model-b-report reports/back_to_back/model_b_evaluated.json \
            --output reports/back_to_back/comparison_report.json

      - name: Render readable comparison report
        run: |
          python src/back_to_back_report.py \
            --comparison reports/back_to_back/comparison_report.json \
            --model-a-report reports/back_to_back/model_a_evaluated.json \
            --model-b-report reports/back_to_back/model_b_evaluated.json \
            --model-a-name "${{ inputs.model_a }}" \
            --model-b-name "${{ inputs.model_b }}" \
            --output reports/back_to_back/comparison_summary.md

      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f reports/back_to_back/comparison_summary.md ]; then
            cat reports/back_to_back/comparison_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Back-to-Back reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: back-to-back-${{ inputs.model_a }}-vs-${{ inputs.model_b }}
          path: reports/back_to_back/
          if-no-files-found: warn
