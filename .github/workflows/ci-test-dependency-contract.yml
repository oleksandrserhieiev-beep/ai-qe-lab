name: CI Test Dependency Contract

on:
  pull_request:
    branches: [main]
    paths:
      - requirements-dev.txt
      - tests/test_requirements_dev_manifest.py
      - .github/workflows/ci-test-dependency-contract.yml

jobs:
  validate-test-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_requirements_dev_manifest.py
