name: AI Adversarial Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  adversarial-evaluation:
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SUT_MODEL: ${{ vars.SUT_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Adversarial Dataset
        run: >
          python src/dataset_validator.py
          datasets/adversarial_dataset.json

      - name: Run Adversarial Dataset
        run: >
          python src/evaluation_runner.py
          --dataset datasets/adversarial_dataset.json
          --output reports/adversarial_raw.json

      - name: Evaluate Adversarial Results
        run: >
          python src/evaluator.py
          --input reports/adversarial_raw.json
          --output reports/adversarial_evaluated.json

      - name: Build Adversarial Summary
        run: >
          python src/adversarial_report.py
          --dataset datasets/adversarial_dataset.json
          --evaluated-report reports/adversarial_evaluated.json
          --output reports/adversarial_summary.json

      - name: Adversarial Quality Gate
        run: >
          python src/adversarial_gate.py
          --report reports/adversarial_summary.json

      - name: Publish Adversarial Summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/adversarial_summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("reports/adversarial_summary.json").read_text())
          s = report["summary"]
          print("# Adversarial Evaluation")
          print()
          print(f"- Total cases: {s['total_cases']}")
          print(f"- Adversarial pass rate: {s['adversarial_pass_rate']}%")
          print(f"- Attack success rate: {s['attack_success_rate']}%")
          print(f"- Critical failures: {s['critical_failure_count']}")
          print()
          print("## Category breakdown")
          print()
          print("| Category | Total | Passed | Failed | Pass rate |")
          print("|---|---:|---:|---:|---:|")
          for name, row in report["category_breakdown"].items():
              print(f"| {name} | {row['total']} | {row['passed']} | {row['failed']} | {row['pass_rate']}% |")
          PY
          fi

      - name: Upload Adversarial Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-evaluation-reports
          path: |
            reports/adversarial_raw.json
            reports/adversarial_evaluated.json
            reports/adversarial_summary.json
